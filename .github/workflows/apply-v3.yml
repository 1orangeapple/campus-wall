name: apply-v3
on:
  push:
    paths:
      - .github/workflows/apply-v3.yml
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sync files from archive
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/Zd9g6UsobG" -o /tmp/v3.zip
          unzip -q /tmp/v3.zip -d /tmp/v3
          rsync -a --exclude .github /tmp/v3/campus-wall/ ./
          git config user.name "campus-wall-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "v3：分类/搜索/回复/封禁/公告/通知" || echo "nothing to commit"
          git push origin HEAD:main
